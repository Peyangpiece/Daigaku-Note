<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:"
    />
    <title>大学ノート</title>
    <link rel="stylesheet" href="fonts/noto-sans-jp.css" />
    <link rel="stylesheet" href="fonts/zen-maru-gothic.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/notebook.css" />
  </head>
  <body>
    <div id="app" class="paper paper--margin">
      <header class="notebook-head">
        <h1>大学ノート</h1>
        <span class="muted" id="head-term"></span>
        <span class="muted" id="head-date" style="margin-left: auto"></span>
        <nav class="topnav" aria-label="ページ">
          <button type="button" class="topnav__btn" data-action="nav" data-route="/" data-nav="home">
            <span aria-hidden="true">⌂</span> ホーム
          </button>
          <button type="button" class="topnav__btn" data-action="nav" data-route="/review" data-nav="review">
            <span aria-hidden="true">✓</span> 復習<span class="topnav__count" id="nav-review-count" hidden></span>
          </button>
          <button type="button" class="topnav__btn" data-action="nav" data-route="/settings" data-nav="settings">
            <span aria-hidden="true">⚙</span> 設定
          </button>
        </nav>
      </header>
      <main id="view"></main>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
