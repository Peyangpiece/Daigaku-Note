<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-zJU76tHLkCaQecIZUuu3d/nt6R8PDf36X0xElYVWvfo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; font-src 'self' data:"
    />
    <!-- three.js と addons（vendor/three-addons に写したもの。配布物では node_modules の examples が外れるため）を名前で import するための対応表。中身を変えたら上の CSP のハッシュも変える -->
    <script type="importmap">
      {
        "imports": {
          "three": "../../node_modules/three/build/three.module.js",
          "three/addons/": "./vendor/three-addons/"
        }
      }
    </script>
    <title>大学ノート</title>
    <link rel="stylesheet" href="fonts/noto-sans-jp.css" />
    <link rel="stylesheet" href="fonts/zen-maru-gothic.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/home.css" />
    <link rel="stylesheet" href="styles/course.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/setup.css" />
    <link rel="stylesheet" href="styles/quiz.css" />
    <link rel="stylesheet" href="styles/viewer.css" />
    <link rel="stylesheet" href="styles/nav.css" />
    <link rel="stylesheet" href="styles/kisekae.css" />
    <link rel="stylesheet" href="styles/fudebako.css" />
    <link rel="stylesheet" href="styles/dialogs.css" />
    <link rel="stylesheet" href="styles/tryout.css" />
    <link rel="stylesheet" href="styles/swipe.css" />
    <link rel="stylesheet" href="styles/desk-tools.css" />
    <link rel="stylesheet" href="styles/desk.css" />
  </head>
  <body>
    <div id="app" class="paper paper--margin">
      <header class="notebook-head">
        <h1>大学ノート</h1>
        <span class="muted" id="head-term"></span>
        <span class="muted" id="head-date" style="margin-left: auto"></span>
        <button
          type="button"
          class="shop-points head-points"
          id="head-points"
          data-action="nav"
          data-route="/fudebako/points"
          hidden
        ></button>
        <nav class="topnav" aria-label="ページ">
          <button type="button" class="topnav__btn" data-action="nav" data-route="/" data-nav="home">
            <span aria-hidden="true">⌂</span> ホーム
          </button>
          <button type="button" class="topnav__btn" data-action="nav" data-route="/review" data-nav="review">
            <span aria-hidden="true">✓</span> 復習<span class="topnav__count" id="nav-review-count" hidden></span>
          </button>
          <button type="button" class="topnav__btn" data-action="nav" data-route="/settings" data-nav="settings">
            <span aria-hidden="true">⚙</span> 設定
          </button>
        </nav>
      </header>
      <main id="view"></main>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
