# 配布物（DESIGN-M0 §1・SPEC §14.5）：Mac（dmg・zip、Apple シリコン・Intel）と Windows（インストーラー）を作る。
# 公開のしかたは 3 つ。どれも GitHub Releases に公開し、最新版の印を付ける。
#   アプリは起動時と 1 時間ごとに Releases の最新版を確かめ、自動で更新する（src/main/updater.js）
# - 自動：package.json の版を上げたコミットが既定のブランチに入ったら（プルリクエストのマージ）、その版がまだ公開されていなければ公開する。
#   版を上げていない変更は公開しない
# - Actions の「Release」→「Run workflow」で「Releases に公開する」に印を付けて動かす（既定のブランチのときだけ）。
#   タグ v<package.json の版> は公開のときに GitHub がその時点のコミットに作る
# - タグ v<版>（package.json の version と同じ）を push する
# 印を付けずに手で動かしたときと、配布の設定を変えるプルリクエストでは、作るだけ（この実行の Artifacts に置く）
# Mac は Apple の Developer ID（チーム 9G78U9XD92。Secrets の MAC_DEVID_P12・MAC_DEVID_PASSWORD）で署名し、Apple の公証を受ける
# （Secrets の APPLE_API_KEY・APPLE_API_KEY_ID・APPLE_API_ISSUER。v0.18.6）。署名と公証は electron-builder がする。
# チームで決まる署名なので、キーチェーンの「常に許可」が版を上げても引き継がれ、Gatekeeper にも止められない。
# Developer ID の証明書がないときは公開しない。作るだけなら、自分で作った証明書（MAC_SIGN_P12・MAC_SIGN_PASSWORD。
# build/after-pack.cjs）か ad-hoc で署名する。Windows は署名なし
name: Release

on:
  push:
    tags: ['v*']
    branches: ['**'] # 既定のブランチかどうか・版が新しいかは decide ジョブで判断する（ほかのブランチではすぐ終わる）
    paths: ['package.json']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'electron-builder.yml'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Releases に公開する（package.json の版でタグを作る）'
        type: boolean
        default: false

permissions:
  contents: read

# 同じブランチの公開を 2 つ同時に走らせない（後のほうは前が終わってから「公開済み」と判断して止まる）
concurrency:
  group: release-${{ github.ref }}

jobs:
  # 公開するかどうか。タグの push・「公開する」に印を付けた手動の実行・既定のブランチに新しい版が入った push のとき
  decide:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.d.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: d
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          publish=false
          if [[ "$REF" == refs/tags/* ]]; then publish=true
          elif [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_PUBLISH" = true ] && [ "$REF" = "$DEFAULT_REF" ]; then publish=true
          elif [ "$EVENT" = push ] && [ "$REF" = "$DEFAULT_REF" ]; then
            # まだ公開していない版のときだけ（下書きや中身のない作りかけは公開していない扱い）
            released=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$tag\" and (.draft|not) and (.assets|length)>0) | .id")
            if [ -z "$released" ]; then publish=true; else echo "$tag は公開済みなので公開しません"; fi
          fi
          echo "公開：$publish（$tag）"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    # ブランチへの push は、公開するときだけ作る（それ以外の push はここで終わる）
    if: github.event_name != 'push' || needs.decide.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 署名の証明書を探さない
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # Chromium はアプリの初回起動時に取り込む（同梱しない）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test "tests/*.test.js" # e2e（Chromium が要る）は CI のほうで走らせる
      - name: タグと package.json の版がそろっているか
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と package.json の版 $v が違います。package.json の版を上げてからタグを付けてください"
            exit 1
          fi
      # Developer ID の証明書と公証の鍵。証明書は作業用のキーチェーンに入れ、electron-builder は mac.identity（チーム ID）で探して署名する。
      # CSC_LINK は使わない（electron-builder 26.15.3 は自分で作るキーチェーンの鍵の設定に .p12 のパスワードを渡して失敗する）。
      # APPLE_API_KEY（.p8 のファイルの場所）・APPLE_API_KEY_ID・APPLE_API_ISSUER があれば公証して、チケットをアプリに付ける（staple）
      - name: Mac の Developer ID の証明書と公証の鍵を用意する
        if: runner.os == 'macOS'
        env:
          MAC_DEVID_P12: ${{ secrets.MAC_DEVID_P12 }}
          MAC_DEVID_PASSWORD: ${{ secrets.MAC_DEVID_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PUBLISH: ${{ needs.decide.outputs.publish }}
        run: |
          if [ -z "$MAC_DEVID_P12" ] || [ -z "$API_KEY" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER" ]; then
            if [ "$PUBLISH" = "true" ]; then echo "::error::Developer ID の証明書か公証の鍵（Secrets の MAC_DEVID_P12・MAC_DEVID_PASSWORD・APPLE_API_KEY・APPLE_API_KEY_ID・APPLE_API_ISSUER）がありません。公開しません（README の「Mac の署名と公証」）"; exit 1; fi
            echo "Developer ID の証明書か公証の鍵がないため、Developer ID では署名しません"; exit 0
          fi
          kc="$RUNNER_TEMP/devid.keychain-db"; kp=$(openssl rand -hex 16)
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          printf '%s' "$MAC_DEVID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$MAC_DEVID_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          # 中間証明書（Developer ID Certification Authority G2）。作業用の Mac になくても署名の鎖がつながるように入れておく
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" || echo "中間証明書は入っていました"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          security find-identity -v -p codesigning "$kc" | grep -q 'Developer ID Application: .*(9G78U9XD92)' || { echo "::error::MAC_DEVID_P12 に Developer ID Application（9G78U9XD92）の証明書と秘密鍵がありません"; exit 1; }
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          # electron-builder はプルリクエストの build では署名しない。Secrets はフォークからのプルリクエストには渡らない
          # （そのときはここまで来ない）ので、Developer ID のときは署名させる
          {
            echo "MAC_DEVID=1"
            echo "CSC_FOR_PULL_REQUEST=true"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER=$API_ISSUER"
          } >> "$GITHUB_ENV"
          echo "Developer ID（チーム 9G78U9XD92）で署名して公証します"
      - name: Mac の自分の証明書を用意する（Developer ID がないとき）
        if: runner.os == 'macOS' && env.MAC_DEVID != '1'
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGN_P12" ]; then echo "署名用の証明書（MAC_SIGN_P12）がないため、ad-hoc 署名で作ります"; exit 0; fi
          kc="$RUNNER_TEMP/daigaku-sign.keychain-db"; kp=$(openssl rand -hex 16)
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          printf '%s' "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$MAC_SIGN_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # 自分で作った証明書は信頼されていないので、この作業用の Mac でだけコード署名用に信頼する
          # （信頼に加えられなくても署名はできる見込みなので、失敗しても止めない）
          security find-certificate -a -p "$kc" > "$RUNNER_TEMP/sign.pem"
          { sudo security authorizationdb write com.apple.trust-settings.admin allow && sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem"; } || echo "証明書を信頼に加えられませんでした（署名はそのまま試します）"
          security find-identity -p codesigning "$kc"
          id=$(security find-identity -p codesigning "$kc" | awk '/[0-9]+\)/{print $2; exit}')
          if [ -z "$id" ]; then echo "::error::MAC_SIGN_P12 にコード署名に使える証明書が見つかりません（証明書のタイプが「コード署名」か確かめてください）"; exit 1; fi
          echo "MAC_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      # electron-builder の公開機能は使わない（Mac と Windows のジョブがそれぞれ Release を作ろうとするため）。
      # 作るだけにして、下の publish ジョブで 1 回にまとめて載せる
      # Mac は入れ物の名前を英字にする（electron-builder.yml の mac の説明。表示名は「パレットノート」）
      # Developer ID のときは mac.identity（electron-builder.yml では null）をチーム ID にして、electron-builder に署名と公証をさせる
      - name: 作る
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then
            args+=(-c.productName=PaletteNote)
            if [ "${MAC_DEVID:-}" = 1 ]; then args+=(-c.mac.identity=9G78U9XD92); fi
          fi
          npx electron-builder --publish never "${args[@]}"
      # Developer ID の版は、署名・公証のチケット・Gatekeeper の判定を確かめる（どれかがだめなら公開しない）
      - name: Mac の署名と公証を確かめる
        if: runner.os == 'macOS' && env.MAC_DEVID == '1'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          for app in release/mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Runtime|Timestamp)'
            codesign -d -r- "$app" 2>&1 | grep designated
            codesign -dv "$app" 2>&1 | grep -q '^TeamIdentifier=9G78U9XD92$' || { echo "::error::$app の署名のチームが 9G78U9XD92 ではありません"; exit 1; }
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done
      # Mac で作ったアプリが起動できるかを確かめる（0.18.0 は入れ物の名前「パレットノート」のせいで起動して 1 秒たたずに止まった）。
      # 8 秒たっても動いていれば起動できたとみなす。止まったら公開しない
      - name: Mac で起動を確かめる
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d release/mac-arm64/*.app | head -1)
          plist="$app/Contents/Info.plist"
          for k in CFBundleName CFBundleDisplayName CFBundleExecutable; do echo "$k: $(/usr/libexec/PlistBuddy -c "Print :$k" "$plist")"; done
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          tmp=$(mktemp -d)
          "$exe" --user-data-dir="$tmp" --enable-logging=stderr > "$tmp.log" 2>&1 &
          pid=$!
          sleep 8
          if kill -0 $pid 2>/dev/null; then echo "起動できました: $app"; kill $pid; exit 0; fi
          wait $pid; echo "::error::Mac のアプリが起動して止まりました（終了コード $?）"; tail -n 40 "$tmp.log"; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: daigaku-note-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    if: needs.decide.outputs.publish == 'true'
    needs: [decide, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 版（package.json）と Release の本文に入れる変更の記録（CHANGELOG.md）だけ取り出す
          sparse-checkout: |
            package.json
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Releases に公開する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # タグの push ならそのタグ、手で動かしたなら package.json の版（build で両者がそろっていることを確かめてある）
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          ls -la release
          test -f release/latest.yml && test -f release/latest-mac.yml || { echo "::error::版の情報（latest.yml・latest-mac.yml）がありません"; exit 1; }
          # 同じ版が公開済みなら止める（版を上げ忘れて、配った版を作り直さないように）。下書きや作りかけは消してから作る
          published=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\" and (.draft|not) and (.assets|length)>0) | .id")
          if [ -n "$published" ]; then echo "::error::$TAG は公開済みです。package.json の版を上げてください"; exit 1; fi
          gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id" | while read -r id; do gh api -X DELETE "repos/$REPO/releases/$id"; done
          # 「最新版」の印は、公開済みのどの版より新しいときだけ付ける（古い版を作り直しても latest にしない）
          v="${TAG#v}"
          newest=$(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.draft|not) | .tag_name' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$newest" "$v" | sort -V | tail -1)" = "$v" ]; then latest=--latest; else latest=--latest=false; fi
          # 本文：CHANGELOG.md のこの版の節（「## 0.10.1」から次の「## 」まで）＋入れ方。節がなければ入れ方だけ
          notes=""
          [ -f CHANGELOG.md ] && notes="$(awk -v v="${TAG#v}" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md)"
          {
            echo "**α 版（試験中）** です。動かないことやデータが消えることがあります。大切な資料は元の場所にも残してください。"
            echo
            if [ -n "$notes" ]; then echo "## 変更"; echo "$notes"; echo; fi
            echo "## 入れ方"
            echo "Mac は .dmg（Apple シリコンは arm64、Intel は x64）、Windows は .exe を入れてください。Mac の版は Apple の Developer ID で署名し、公証を受けています。Windows は署名がないため、SmartScreen に止められたら「詳細情報 → 実行」を押してください。2 回目からはアプリが自動で更新します。"
          } > release-notes.md
          gh release create "$TAG" --repo "$REPO" --target "$SHA" $latest --title "パレットノート $TAG" \
            --notes-file release-notes.md \
            release/*.dmg release/*.zip release/*.exe release/*.blockmap release/latest*.yml
