# 配布物（DESIGN-M0 §1・SPEC §14.5）：Mac（dmg・zip、Apple シリコン・Intel）と Windows（インストーラー）を作る。
# 公開のしかたは 2 つ。どちらも GitHub Releases に公開し、最新版の印を付ける。
#   アプリは起動時と 1 時間ごとに Releases の最新版を確かめ、自動で更新する（src/main/updater.js）
# - Actions の「Release」→「Run workflow」で「Releases に公開する」に印を付けて動かす（既定のブランチのときだけ）。
#   タグ v<package.json の版> は公開のときに GitHub がその時点のコミットに作る
# - タグ v<版>（package.json の version と同じ）を push する
# 印を付けずに手で動かしたときと、配布の設定を変えるプルリクエストでは、作るだけ（この実行の Artifacts に置く）
# Apple・Windows の証明書はない。Mac は自分で作った「コード署名」の証明書（Secrets の MAC_SIGN_P12・MAC_SIGN_PASSWORD）で
# 署名する（build/after-pack.cjs）。毎回同じ証明書で署名するので、更新のあとも保存した LMS のログインを読める。
# 証明書がないときは ad-hoc 署名で作るだけはできるが、公開はしない（ad-hoc の版に更新すると接続が切れるため）。Windows は署名なし
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'electron-builder.yml'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Releases に公開する（package.json の版でタグを作る）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 署名の証明書を探さない
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # Chromium はアプリの初回起動時に取り込む（同梱しない）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test "tests/*.test.js" # e2e（Chromium が要る）は CI のほうで走らせる
      - name: タグと package.json の版がそろっているか
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と package.json の版 $v が違います。package.json の版を上げてからタグを付けてください"
            exit 1
          fi
      - name: Mac の署名の証明書を用意する
        if: runner.os == 'macOS'
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          if [ -z "$MAC_SIGN_P12" ]; then
            if [ "$PUBLISH" = "true" ]; then echo "::error::署名用の証明書（Secrets の MAC_SIGN_P12・MAC_SIGN_PASSWORD）がありません。ad-hoc 署名の版を配ると、更新のあと LMS への接続が切れるため公開しません（README の「Mac の署名の証明書」）"; exit 1; fi
            echo "署名用の証明書（MAC_SIGN_P12）がないため、ad-hoc 署名で作ります"; exit 0
          fi
          kc="$RUNNER_TEMP/daigaku-sign.keychain-db"; kp=$(openssl rand -hex 16)
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          printf '%s' "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$MAC_SIGN_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # 自分で作った証明書は信頼されていないので、この作業用の Mac でだけコード署名用に信頼する
          # （信頼に加えられなくても署名はできる見込みなので、失敗しても止めない）
          security find-certificate -a -p "$kc" > "$RUNNER_TEMP/sign.pem"
          { sudo security authorizationdb write com.apple.trust-settings.admin allow && sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem"; } || echo "証明書を信頼に加えられませんでした（署名はそのまま試します）"
          security find-identity -p codesigning "$kc"
          id=$(security find-identity -p codesigning "$kc" | awk '/[0-9]+\)/{print $2; exit}')
          if [ -z "$id" ]; then echo "::error::MAC_SIGN_P12 にコード署名に使える証明書が見つかりません（証明書のタイプが「コード署名」か確かめてください）"; exit 1; fi
          echo "MAC_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      # electron-builder の公開機能は使わない（Mac と Windows のジョブがそれぞれ Release を作ろうとするため）。
      # 作るだけにして、下の publish ジョブで 1 回にまとめて載せる
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: daigaku-note-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Releases に公開する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # タグの push ならそのタグ、手で動かしたなら package.json の版（build で両者がそろっていることを確かめてある）
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          ls -la release
          test -f release/latest.yml && test -f release/latest-mac.yml || { echo "::error::版の情報（latest.yml・latest-mac.yml）がありません"; exit 1; }
          # 同じ版が公開済みなら止める（版を上げ忘れて、配った版を作り直さないように）。下書きや作りかけは消してから作る
          published=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\" and (.draft|not) and (.assets|length)>0) | .id")
          if [ -n "$published" ]; then echo "::error::$TAG は公開済みです。package.json の版を上げてください"; exit 1; fi
          gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id" | while read -r id; do gh api -X DELETE "repos/$REPO/releases/$id"; done
          # 「最新版」の印は、公開済みのどの版より新しいときだけ付ける（古い版を作り直しても latest にしない）
          v="${TAG#v}"
          newest=$(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.draft|not) | .tag_name' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$newest" "$v" | sort -V | tail -1)" = "$v" ]; then latest=--latest; else latest=--latest=false; fi
          gh release create "$TAG" --repo "$REPO" --target "$SHA" $latest --title "大学ノート $TAG" \
            --notes "Mac は .dmg（Apple シリコンは arm64、Intel は x64）、Windows は .exe を入れてください。Apple・Windows の署名がないため、Mac は初回に止められたら「システム設定 → プライバシーとセキュリティ」の「このまま開く」、Windows は SmartScreen の「詳細情報 → 実行」を押してください。2 回目からはアプリが自動で更新します。" \
            release/*.dmg release/*.zip release/*.exe release/*.blockmap release/latest*.yml
