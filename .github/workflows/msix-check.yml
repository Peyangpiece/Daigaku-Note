# Microsoft Store で配る形（MSIX）で大学ノートが動くかを確かめる（公開はしない）。
# Windows の作業機で MSIX を作り、試験用の自己署名の証明書で署名して入れ、パッケージの中で --self-test を動かす（src/main/self-test.js）。
# 確かめること：userData・保存先（デスクトップ）への書き込み、SQLite、秘密の暗号化、LMS 用のブラウザ（Chromium）の取り込みと起動。
# Store に出すときの名前・発行者（publisher）はパートナーセンターで決まるので、ここでは試験用の値を使う
name: MSIX check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/msix-check.yml'
      - 'src/main/self-test.js'
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/msix-check.yml'
      - 'src/main/self-test.js'

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # Chromium はアプリの中で取り込む（それを確かめる）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 試験用の証明書を作り、この作業機でだけ信頼する
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=DaigakuNoteTest' -KeyUsage DigitalSignature `
            -FriendlyName 'Daigaku Note MSIX test' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pw = ConvertTo-SecureString -String 'msix-test' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\msix-test.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\msix-test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\msix-test.cer" -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
      # PowerShell は -c.appx.… の引数を分けてしまうので bash で動かす
      # 署名は electron-builder に任せない（同梱の signtool がこの Windows で動かない：A required function is not present）。
      # 署名なしで作って、下で Windows SDK の signtool で署名する
      - name: MSIX（appx）を作る
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win appx --x64 --publish never \
            -c.appx.identityName=DaigakuNote.Test -c.appx.applicationId=DaigakuNote \
            '-c.appx.publisher=CN=DaigakuNoteTest' '-c.appx.publisherDisplayName=Daigaku Note Test'
          ls -la release/*.appx
      - name: Windows SDK の signtool で試験用の証明書の署名をする
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          "signtool：$($signtool.FullName)"
          $appx = Get-ChildItem release -Filter *.appx | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\msix-test.pfx" /p msix-test $appx.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error '署名できませんでした'; exit 1 }
      - name: 入れて、パッケージの中で動作確認を動かす
        shell: pwsh
        run: |
          $appx = Get-ChildItem release -Filter *.appx | Select-Object -First 1
          Add-AppxPackage -Path $appx.FullName
          $pkg = Get-AppxPackage -Name 'DaigakuNote.Test'
          "パッケージ：$($pkg.PackageFullName)"
          "置き場所：$($pkg.InstallLocation)"
          $exe = Get-ChildItem $pkg.InstallLocation -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'elevate|crashpad|Uninstall' } | Sort-Object Length -Descending | Select-Object -First 1
          "起動するもの：$($exe.FullName)"
          $out = "$env:RUNNER_TEMP\self-test\result.json"
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId 'DaigakuNote' -Command $exe.FullName -Args "--self-test=$out"
          # Chromium の取り込み（約 150 MB）があるので、最大 20 分待つ
          for ($i = 0; $i -lt 240 -and -not (Test-Path $out); $i++) { Start-Sleep -Seconds 5 }
          if (-not (Test-Path $out)) { Write-Error '動作確認の結果が出ませんでした（起動できなかった可能性）'; exit 1 }
          Start-Sleep -Seconds 2
          $r = Get-Content $out -Raw -Encoding utf8
          $r
          $j = $r | ConvertFrom-Json
          "Store の中で動いたか（process.windowsStore）：$($j.windowsStore)"
          if (-not $j.ok) { Write-Error 'MSIX の中で動かないところがあります（上の checks を参照）'; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msix-check
          path: ${{ runner.temp }}\self-test\result.json
          if-no-files-found: ignore
