# 検査（push とプルリクエストのたび）：lint とテスト。レシピ実行器の e2e のため Chromium を入れる
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron の実行ファイルを先に入れる。入っていないと、最初に require('electron') した通しテストがその場で展開し、
      # 同時に動くもう一方の通しテストの起動が ETXTBSY（書き込み中の実行ファイル）で失敗する
      - run: node node_modules/electron/install.js
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run format:check
      - run: xvfb-run -a npm test # 画面の通しテスト（tests/e2e/app.test.js）は Electron を起動するので仮想の画面で

  # Mac・Windows でも単体のテストを動かす（大文字と小文字を区別しない・道の区切りが違う所でしか出ない不具合を見つける。
  # 画面の通しテスト tests/e2e は Linux の test ジョブだけ）
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test "tests/*.test.js"
        shell: bash
