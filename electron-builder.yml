# 配布物の設定（SPEC §14.5、DESIGN-M0 §1）。Chromium は同梱せず初回起動時に取り込む
# 自動更新：electron-updater が Releases の latest.yml（Windows）・latest-mac.yml（Mac）を読む。latest-mac.yml を作るには zip も要る
appId: jp.daigakunote.app
productName: 大学ノート
artifactName: daigaku-note-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - src/**
  - recipes/**
  - package.json
  - '!src/**/*.test.js'
  # three.js（文房具の 3D モデル）は本体の ESM だけ（addons は src/renderer/vendor/three-addons に写してある。
  # node_modules の examples は electron-builder が自動で外すため）
  - '!node_modules/three/src/**'
  - '!node_modules/three/build/three.{cjs,module.min.js,webgpu.js,webgpu.min.js,webgpu.nodes.js,webgpu.nodes.min.js}'
asarUnpack:
  - node_modules/playwright/**
  - node_modules/playwright-core/**
publish:
  provider: github
  owner: Peyangpiece
  repo: Daigaku-Note
afterPack: build/after-pack.cjs
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null # Apple の証明書はない。署名は build/after-pack.cjs の ad-hoc
  hardenedRuntime: false
  extendInfo:
    NSDesktopFolderUsageDescription: 授業資料をデスクトップの「大学ノート」フォルダに保存するために使います。
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
