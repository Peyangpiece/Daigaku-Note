# 配布物の設定（SPEC §14.5、DESIGN-M0 §1）。Chromium は同梱せず初回起動時に取り込む
# 自動更新：electron-updater が Releases の latest.yml（Windows）・latest-mac.yml（Mac）を読む。latest-mac.yml を作るには zip も要る
appId: jp.daigakunote.app
# 表示名。v0.18.0 で「大学ノート」から変えた。appId・artifactName（daigaku-note-…）は前の版の自動更新が探すので変えない
productName: パレットノート
artifactName: daigaku-note-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - src/**
  - recipes/**
  - package.json
  - THIRD-PARTY-NOTICES.md
  # 既製品の 3D モデル（src/renderer/assets/stationery/ の craftlab-004・jetstream・sarasa-clip・caran-849・caran-849-premium・parker-jotter・lamy-2000・kaweco-special）は、α 版のあいだは配布物に入れる（公式の品の GLB はいつも入れる）。
  # 正式に公開する前に、許しを得られなければ '!src/renderer/assets/stationery/<名前>.glb' で除く（stationery.js の MAKER_ITEMS_LISTED）
  # three.js（文房具の 3D モデル）は本体の ESM だけ（addons は src/renderer/vendor/three-addons に写してある。
  # node_modules の examples は electron-builder が自動で外すため）
  - '!node_modules/three/src/**'
  - '!node_modules/three/build/three.{cjs,module.min.js,webgpu.js,webgpu.min.js,webgpu.nodes.js,webgpu.nodes.min.js}'
asarUnpack:
  - node_modules/playwright/**
  - node_modules/playwright-core/**
publish:
  provider: github
  owner: Peyangpiece
  repo: Daigaku-Note
afterPack: build/after-pack.cjs
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # 公開する版は Apple の Developer ID（チーム 9G78U9XD92）で署名して公証する（v0.18.6）。release.yml が -c.mac.identity=9G78U9XD92 を渡し、
  # 証明書（作業用のキーチェーン）と公証の鍵（APPLE_API_KEY など）を用意する。ここでは null にして、手元で作るとき（install-mac.sh）は
  # build/after-pack.cjs の ad-hoc 署名にする
  # Mac のアイコン：16・32 px は小さい表示用の形（brand/source/icon-small.svg）、64 px 以上は icon-mac.svg（build/icon.icns）
  icon: build/icon.icns
  identity: null
  hardenedRuntime: true # 公証に要る。Developer ID で署名するときだけ効く
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 入れ物の名前（.app・実行ファイル・CFBundleName）は英字 PaletteNote（release.yml・install-mac.sh が -c.productName で指す）。
  # 「パ」のように濁点・半濁点が分かれる字（NFD）が入ると、Electron が起動の準備で止まる（0.18.0。CI の起動の確認で再現）。
  # Finder・Dock・Launchpad には表示名（CFBundleDisplayName、日本語は ja.lproj）の「パレットノート」を出す
  extraResources:
    - from: build/mac-locale/ja.lproj
      to: ja.lproj
  extendInfo:
    CFBundleDisplayName: パレットノート
    LSHasLocalizedDisplayName: true
    NSCameraUsageDescription: アナログのノート紙（Palette スキャンノート）を撮って、授業の回のノートに取り込むために使います。
    NSDesktopFolderUsageDescription: 授業資料をデスクトップの「パレットノート」フォルダ（前の版から使っている人は「大学ノート」フォルダ）に保存するために使います。
dmg:
  sign: false
win:
  # Windows のアイコン：余白と影のない形（brand/source/icon-win.svg）と、16〜48 px は小さい表示用の形（icon-small.svg）。
  # Mac 用の build/icon.png は Mac の格子（余白と影つき）なので、Windows では小さく見える
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
